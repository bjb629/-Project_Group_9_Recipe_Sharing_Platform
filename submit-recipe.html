
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Recipe - Food Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <h2 class="nav-title">Food Swap</h2>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="submit-recipe.html">Submit Recipe</a></li>
            </ul>
        </nav>
    </header>

    <main class="recipe-form-container">
        <h2>Share Your Recipe</h2>
        <p>Fill out the form below to share your recipe!</p>

        <form id="recipeForm">
            <label for="title">Recipe Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="ingredients">Ingredients:</label>
            <textarea id="ingredients" name="ingredients" required></textarea>

            <label for="instructions">Instructions:</label>
            <textarea id="instructions" name="instructions" required></textarea>

            <label for="cookTime">Cooking Time (minutes):</label>
            <input type="number" id="cookTime" name="cookTime" min="1" required>

            <label for="difficulty">Difficulty:</label>
            <select id="difficulty" name="difficulty" required>
                <option value="">Select Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <label for="mealType">Meal Type:</label>
            <select id="mealType" name="mealType" required>
                <option value="">Select Meal Type</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Dessert">Dessert</option>
            </select>

           
<label>Dietary Restrictions:</label>
<div class="dietary-options">
    <label><input type="checkbox" name="dietary" value="Vegetarian"> Vegetarian</label>
    <label><input type="checkbox" name="dietary" value="Vegan"> Vegan</label>
    <label><input type="checkbox" name="dietary" value="Gluten-Free"> Gluten-Free</label>
    <label><input type="checkbox" name="dietary" value="Dairy-Free"> Dairy-Free</label>
</div>


            <button type="submit">Submit Recipe</button>
        </form>
    </main>

    <footer>
        <p>Food Swap</p>
    </footer>

    <script src="js/submit-recipe.js"></script>
</body>
</html>
